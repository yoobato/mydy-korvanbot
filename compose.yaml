name: korvanbot
services:
  korvanbot:
    build: .
    restart: unless-stopped
    env_file:
      - ${KORVANBOT_ENV_FILE:-.env}
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data:/data
      - ./boards.json:/app/boards.json:ro
  preview:
    image: caddy:2.10-alpine
    profiles: [public-preview]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
    volumes:
      - ./deploy/preview.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/public:/srv:ro
    networks:
      edge:
        aliases: [korvanbot-preview]
networks:
  edge:
    external: true
    name: mydy_edge
