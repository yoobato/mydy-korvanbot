name: korvanbot
services:
  korvanbot:
    build: .
    restart: unless-stopped
    env_file:
      - ${KORVANBOT_ENV_FILE:?Set the absolute path to the external secrets file}
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    volumes:
      - ./data:/data
      - ./boards.json:/app/boards.json:ro
